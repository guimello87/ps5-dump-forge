name: build image

# Daily: if upstream has a release we haven't built yet, build it and push
#   ghcr.io/<owner>/ps5-dump-forge:<version> and :latest
# Unraid's update check compares :latest's digest, so a new push shows "update ready" there.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream tag to build (e.g. v0.5.7). Empty = latest release; forces a rebuild."
        required: false
  push:
    branches: [main]
    paths: [Dockerfile, .github/workflows/build.yml]

permissions:
  contents: read
  packages: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve upstream version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          tag="${INPUT:-}"
          if [ -z "$tag" ]; then
            tag=$(gh api repos/quer3q/ps5-dump-forge/releases/latest --jq .tag_name 2>/dev/null) \
              || tag=$(gh api repos/quer3q/ps5-dump-forge/tags --jq '.[0].name')
          fi
          ver="${tag#v}"
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ps5-dump-forge"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "img=$img" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = schedule ] && docker manifest inspect "$img:$ver" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$img:$ver already built - nothing to do."
          else
            echo "Building $tag -> $img:$ver"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.v.outputs.skip != 'true'

      - uses: docker/build-push-action@v6
        if: steps.v.outputs.skip != 'true'
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: FORGE_VERSION=${{ steps.v.outputs.tag }}
          tags: |
            ${{ steps.v.outputs.img }}:${{ steps.v.outputs.ver }}
            ${{ steps.v.outputs.img }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.ver }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
